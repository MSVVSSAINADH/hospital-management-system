# Database Configuration
spring.application.name=hmsystem

# NOTE: This port setting is ignored when deploying WAR to external Tomcat
# (Tomcat uses port 9090 based on our Dockerfile change), but you can keep it.
server.port=8086

# !!! CRITICAL CHANGE BELOW !!!
# Replace 'localhost' with 'db' (the name of the database service in docker-compose)
# spring.datasource.url=jdbc:mysql://db:3306/hms_db
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/hms_db}

spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Config
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Use the standard MySQL dialect (MySQL8Dialect is deprecated in newer Hibernate versions)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# -------------------------------------------------------------------------
# FIX 1: PREVENT ERROR PAGE FILTER CRASH
# -------------------------------------------------------------------------
# Disable Spring Boot's default Error Page Filter.
# This prevents the "Failed to register 'filter errorPageFilterRegistration'" error
# when running inside an external Tomcat container.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.web.servlet.error.ErrorMvcAutoConfiguration

# -------------------------------------------------------------------------
# FIX 2: ALLOW BEAN OVERRIDING (CRITICAL NEW FIX)
# -------------------------------------------------------------------------
# This allows your manual 'securityFilterChainRegistration' bean in BackendApplication.java
# to override the default one created by Spring Boot's auto-configuration.
# This stops the "BeanDefinitionOverrideException" crash.
spring.main.allow-bean-definition-overriding=true

# -------------------------------------------------------------------------
# SECURITY CONFIGURATIONS
# -------------------------------------------------------------------------
app.cors.allowedOrigins=${CORS_ALLOWED_ORIGINS:http://localhost:5100,http://localhost:5101,http://localhost:30000,http://localhost:5173}
app.jwt.secret=${JWT_SECRET:hms_super_secret_key_which_needs_to_be_long_enough_for_hmac_sha256}
app.jwt.expiration=${JWT_EXPIRATION:86400000}
logging.level.org.springframework.security=DEBUG
