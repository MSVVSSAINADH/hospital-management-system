
# Database Configuration
spring.application.name=hmsystem
server.port=8086

# Database credentials must be supplied through environment variables
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/hms_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Error page filter configuration
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.web.servlet.error.ErrorMvcAutoConfiguration

# Bean overriding
spring.main.allow-bean-definition-overriding=true

# Security Configuration
app.cors.allowedOrigins=${CORS_ALLOWED_ORIGINS:http://localhost:5100,http://localhost:5101,http://localhost:30000,http://localhost:5173}
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# Avoid verbose security logs in normal operation
logging.level.org.springframework.security=INFO
